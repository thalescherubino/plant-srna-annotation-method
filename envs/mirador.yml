# Recent-Python environment for miRador, used with the Python 3.12 port of miRador
# (upstream rkweku/miRador commit c68c1536 plus the documented port; see docs/setup.md).
# conda-forge + bioconda only: avoids the Anaconda `defaults` channel used by upstream
# environment.yml. Tested 2026-11-05 on Linux x86_64 (glibc 2.34); the bundled Arabidopsis
# chr1 test reproduced the upstream Python 3.7 outputs byte-for-byte.
name: plant-srna-mirador
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.16
  - biopython=1.88
  - pypdf=6.21.4
  - blast=2.17.0
  - bowtie=1.3.1
  - emboss=6.6.0
  - samtools=1.25
  - viennarna=2.7.2
  - ghostscript=10.08.0
  - perl=5.32.1
  - perl-io-string=1.08
