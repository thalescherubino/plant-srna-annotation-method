<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Plant small-RNA annotation workflow, Version 2</title>
  <desc id="d">Inputs: a plant genome and small-RNA-seq libraries (public GEO/SRA and in-house). Step 1 prepares the reference genome. Step 2 finds and selects at least 100 libraries for organ diversity; step 3 trims, collapses and QCs them into a frozen tag-count set. The same genome and tag counts feed three branches: miRNA (step 5 prediction with ShortStack 4 and miRador, step 6 scoring with miRScore, miRBase scored as a test set), PHAS loci (step 7, Phasis, 21 and 24 nt, per library and pooled, combined with phasis-compare) and structural RNAs (step 8, tRNAscan-SE and Rfam cmscan, compared with RNAcentral afterwards). All branches feed step 9, review and interpretation, then step 10, the release package. Step 4 (environments and a detached run queue) supports every heavy step. Red marks points where a person must decide.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="660" fill="#fff"/>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <!-- inputs -->
    <rect x="30" y="20" width="280" height="50" rx="8"/>
    <rect x="340" y="20" width="590" height="50" rx="8"/>
    <!-- row 2 -->
    <rect x="30" y="105" width="280" height="64" rx="8"/>
    <rect x="340" y="105" width="280" height="64" rx="8"/>
    <rect x="650" y="105" width="280" height="64" rx="8"/>
    <!-- branches -->
    <rect x="30" y="275" width="280" height="64" rx="8"/>
    <rect x="30" y="365" width="280" height="64" rx="8"/>
    <rect x="340" y="275" width="280" height="154" rx="8"/>
    <rect x="650" y="275" width="280" height="154" rx="8"/>
    <!-- review, release -->
    <rect x="30" y="470" width="900" height="64" rx="8"/>
    <rect x="250" y="565" width="460" height="64" rx="8"/>
  </g>
  <!-- shared-input bar -->
  <rect x="30" y="200" width="900" height="44" rx="8" fill="#fff" stroke="#1f4fbf" stroke-width="3"/>
  <text x="480" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4fbf">Same genome + same frozen tag-count libraries feed every branch</text>

  <g font-size="17" font-weight="bold" fill="#000" text-anchor="middle">
    <text x="170" y="51">Plant genome assembly</text>
    <text x="635" y="51">Small-RNA-seq libraries: public (GEO, SRA) and in-house</text>
    <text x="170" y="131">1  Reference genome prep</text>
    <text x="480" y="131">2  Find and select libraries</text>
    <text x="790" y="131">3  Trim, collapse, QC</text>
    <text x="170" y="301">5  Predict <tspan font-style="italic">MIR</tspan> loci</text>
    <text x="170" y="391">6  Score miRNA candidates</text>
    <text x="480" y="301">7  <tspan font-style="italic">PHAS</tspan> loci</text>
    <text x="790" y="301">8  Structural RNAs</text>
    <text x="480" y="496">9  Review and interpret results</text>
    <text x="480" y="591">10  Release package</text>
  </g>
  <g font-size="15" fill="#000" text-anchor="middle">
    <text x="170" y="155">copy, checksums, indexes</text>
    <text x="480" y="155">≥ 100, maximum organ diversity</text>
    <text x="790" y="155">frozen tag-count set</text>
    <text x="170" y="325">ShortStack 4 · miRador</text>
    <text x="170" y="415">miRScore (miRBase = test set)</text>
    <text x="480" y="330">Phasis, 21 and 24 nt</text>
    <text x="480" y="356">per library + pooled</text>
    <text x="480" y="382">→ phasis-compare</text>
    <text x="480" y="408">phasiRNAs by register</text>
    <text x="790" y="330">tRNAscan-SE</text>
    <text x="790" y="356">Rfam structural models (cmscan)</text>
    <text x="790" y="382">then compare with RNAcentral</text>
    <text x="480" y="520">outputs guide · cross-class overlaps · score cut-offs</text>
    <text x="480" y="615">GFF3 · FASTA · evidence tables · exclusion ledgers</text>
  </g>

  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="170" y1="70" x2="170" y2="103"/>
    <line x1="480" y1="70" x2="480" y2="103"/>
    <line x1="620" y1="137" x2="648" y2="137"/>
    <line x1="170" y1="169" x2="170" y2="198"/>
    <line x1="790" y1="169" x2="790" y2="198"/>
    <line x1="170" y1="244" x2="170" y2="273"/>
    <line x1="480" y1="244" x2="480" y2="273"/>
    <line x1="790" y1="244" x2="790" y2="273"/>
    <line x1="170" y1="339" x2="170" y2="363"/>
    <line x1="170" y1="429" x2="170" y2="468"/>
    <line x1="480" y1="429" x2="480" y2="468"/>
    <line x1="790" y1="429" x2="790" y2="468"/>
    <line x1="480" y1="534" x2="480" y2="563"/>
  </g>

  <!-- human decision points (red) -->
  <g fill="#c00000" font-size="17" font-weight="bold">
    <circle cx="607" cy="118" r="11"/><text x="607" y="124" text-anchor="middle" fill="#fff">!</text>
    <circle cx="607" cy="288" r="11"/><text x="607" y="294" text-anchor="middle" fill="#fff">!</text>
    <circle cx="917" cy="483" r="11"/><text x="917" y="489" text-anchor="middle" fill="#fff">!</text>
  </g>
  <g font-size="15">
    <circle cx="738" cy="590" r="9" fill="#c00000"/>
    <text x="754" y="595" fill="#c00000">a person decides</text>
    <text x="738" y="620" fill="#1f4fbf">4  Compute and queue:</text>
    <text x="738" y="642" fill="#1f4fbf">every heavy step, detached</text>
  </g>
</svg>
